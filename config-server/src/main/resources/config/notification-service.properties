spring.application.name=notification-service
server.port=8084

eureka.instance.hostname=notification-service
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Distributed Lock Configuration
distributed.lock.default-wait-time=5
distributed.lock.default-lease-time=30

# Actuator - override shared config since no security filter chain
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=HikariPool-NotificationService