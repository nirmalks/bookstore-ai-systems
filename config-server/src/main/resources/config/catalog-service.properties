spring.application.name=catalog-service
server.port=8082

# Primary Database (Writes)
spring.datasource.url=jdbc:postgresql://catalog-db-primary:5432/bookstore_catalog_service_db?stringtype=unspecified
spring.datasource.primary.jdbc-url=jdbc:postgresql://catalog-db-primary:5432/bookstore_catalog_service_db?stringtype=unspecified
spring.datasource.primary.driver-class-name=org.postgresql.Driver

# Replica Database (Reads)
spring.datasource.replica.jdbc-url=jdbc:postgresql://catalog-db-replica:5432/bookstore_catalog_service_db?stringtype=unspecified
spring.datasource.replica.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Use IP address for Docker container communication
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.uuid}

catalog-service.base-url=http://catalog-service:8082

# we have custom health indicators so disable built-in indicators to avoid redundant checks
management.health.datasource.enabled=false
management.health.rabbit.enabled=false

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Distributed Lock Configuration
distributed.lock.default-wait-time=5
distributed.lock.default-lease-time=30

# Audit logging
audit.enabled=true
audit.exchange=audit.exchange
audit.routing-key=audit.event
audit.service-name=${spring.application.name}
audit.environment=${ENVIRONMENT:local}

# HikariCP Connection Pool Tuning
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=20
spring.datasource.hikari.connection-timeout=3000
spring.datasource.hikari.max-lifetime=1500000
spring.datasource.hikari.leak-detection-threshold=5000
spring.datasource.hikari.pool-name=HikariPool-CatalogService

# Primary Datasource Hikari Pool Tuning
spring.datasource.primary.maximum-pool-size=20
spring.datasource.primary.minimum-idle=20
spring.datasource.primary.connection-timeout=3000
spring.datasource.primary.max-lifetime=1500000
spring.datasource.primary.leak-detection-threshold=5000
spring.datasource.primary.pool-name=HikariPool-CatalogService-Primary
spring.datasource.primary.hikari.maximum-pool-size=20
spring.datasource.primary.hikari.minimum-idle=20
spring.datasource.primary.hikari.connection-timeout=3000
spring.datasource.primary.hikari.max-lifetime=1500000
spring.datasource.primary.hikari.leak-detection-threshold=5000
spring.datasource.primary.hikari.pool-name=HikariPool-CatalogService-Primary

# Replica Datasource Hikari Pool Tuning
spring.datasource.replica.maximum-pool-size=20
spring.datasource.replica.minimum-idle=20
spring.datasource.replica.connection-timeout=3000
spring.datasource.replica.max-lifetime=1500000
spring.datasource.replica.leak-detection-threshold=5000
spring.datasource.replica.pool-name=HikariPool-CatalogService-Replica
spring.datasource.replica.hikari.maximum-pool-size=20
spring.datasource.replica.hikari.minimum-idle=20
spring.datasource.replica.hikari.connection-timeout=3000
spring.datasource.replica.hikari.max-lifetime=1500000
spring.datasource.replica.hikari.leak-detection-threshold=5000
spring.datasource.replica.hikari.pool-name=HikariPool-CatalogService-Replica

