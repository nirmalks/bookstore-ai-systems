spring.config.import=
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
spring.cloud.vault.enabled=false
spring.cloud.discovery.enabled=false
eureka.client.enabled=false

spring.datasource.primary.jdbc-url=jdbc:h2:mem:catalog-primary;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.primary.driver-class-name=org.h2.Driver
spring.datasource.replica.jdbc-url=jdbc:h2:mem:catalog-replica;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.replica.driver-class-name=org.h2.Driver

spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
